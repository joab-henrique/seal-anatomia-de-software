<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070d20" />
    <meta
      name="description"
      content="Toque em um site. Descubra as camadas por trás dele e o que é engenharia de software. Uma experiência SEAL · CIn–UFPE."
    />
    <title>Anatomia de Software · SEAL</title>
    <link rel="icon" href="logo-seal.png" />
    <link rel="stylesheet" href="src/styles/index.css" />
    <script src="src/main.js" type="module"></script>
  </head>
  <body>
    <main
      class="experience"
      id="experience"
      aria-label="Anatomia de Software, uma experiência 3D da SEAL"
    >
      <div class="backdrop" aria-hidden="true">
        <div class="aurora"><i></i><i></i><i></i></div>
        <div class="starfield"></div>
        <div class="horizon"></div>
        <div class="grid-floor"><div></div></div>
        <div class="vignette"></div>
      </div>

      <header class="topbar">
        <div class="signature" aria-hidden="true">
          <img src="logo-seal.png" alt="" />
          <span>SEAL</span><i></i>
          <em>ANATOMIA DE SOFTWARE</em>
        </div>
        <button
          id="reset"
          class="reset glass"
          aria-label="Voltar ao início"
          title="Voltar ao início"
        >
          <span id="reset-icon" aria-hidden="true"></span>
        </button>
      </header>

      <div
        id="intro-world"
        class="intro-world"
        role="img"
        aria-label="Cena 3D vista por trás de uma pessoa com moletom da SEAL, sentada diante de um notebook."
      ></div>

      <div
        class="stage"
        id="stage"
        aria-label="Arquitetura em três dimensões. Toque em uma camada; arraste para girar."
      >
        <div class="ground" aria-hidden="true">
          <div></div>
          <div></div>
          <div></div>
        </div>
        <div class="model-anchor" id="model-anchor">
          <div class="float">
            <div class="model" id="model">
              <div class="spine" aria-hidden="true"></div>
              <div id="plates"></div>
              <div id="signal" class="signal" aria-hidden="true"><i></i><i></i></div>
            </div>
          </div>
        </div>
        <div id="focus-preview" class="focus-preview" aria-hidden="true"></div>
        <div class="orbit-hint" id="orbit-hint" aria-hidden="true">
          <span aria-hidden="true">⇄</span> arraste para girar
        </div>
      </div>

      <section
        class="practices"
        id="practices"
        aria-label="Práticas da engenharia de software"
        hidden
      >
        <h2>Engenharia de software é tudo isto.</h2>
        <div class="practice-grid" id="practice-grid"></div>
      </section>

      <aside class="panel" id="panel" aria-label="Explicação e controles">
        <nav class="rail" id="rail" aria-label="Ir para uma camada" hidden></nav>
        <div class="panel-body">
          <div class="caption" aria-live="polite" aria-atomic="true">
            <span class="term" id="caption-term" hidden></span>
            <h1 id="caption-title">O que existe por trás de um clique?</h1>
            <p id="caption-text" hidden></p>
          </div>
        </div>
        <div class="panel-actions">
          <button id="toggle" class="secondary-action glass" hidden>
            <span class="action-icon" id="toggle-icon" aria-hidden="true"></span>
            <span id="toggle-label">Voltar</span>
          </button>
          <button id="advance" class="main-action">
            <span id="advance-label">Começar</span>
            <span class="action-icon" id="advance-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div class="social" id="social">
          <a
            href="https://www.instagram.com/seal.ufpe"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="SEAL no Instagram"
            title="@seal.ufpe no Instagram"
          ></a>
          <a
            href="https://www.linkedin.com/company/sealufpe"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="SEAL no LinkedIn"
            title="SEAL no LinkedIn"
          ></a>
        </div>
        <span class="footnote" id="footnote"></span>
      </aside>

      <noscript>
        <p class="no-script">Ative o JavaScript para explorar as camadas do software.</p>
      </noscript>
    </main>
  </body>
</html>
